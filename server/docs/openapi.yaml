# Documentation de l'API VIGIE, affichée sur /api/docs (Swagger UI).
# Règle de la Definition of Done : toute route ajoutée ou modifiée est décrite ici, dans la même PR.
# Les valeurs autorisées (enum) doivent rester identiques à server/src/models/constantes.js :
# un test (src/docs/specificationApi.test.js) le vérifie.
openapi: 3.0.3
info:
  title: API VIGIE
  version: 0.1.0
  description: |
    API REST de VIGIE, application de gestion d'incidents IT.

    **Authentification** : se connecter avec `POST /auth/connexion`, copier le `jeton` reçu,
    puis cliquer sur **Authorize** et le coller. Toutes les routes exigent ce jeton,
    sauf celles marquées sans cadenas.

    **Règles communes à toutes les routes protégées**
    - sans jeton, ou jeton invalide ou expiré : `401` ;
    - le rôle `LECTEUR` est en lecture seule : toute requête autre que `GET` répond `403` ;
    - une adresse inconnue répond `404`.

    **Erreurs** : toujours au format `{ "message": "…" }`, sans détail technique.
servers:
  - url: /api
tags:
  - name: Système
  - name: Authentification
  - name: Services
    description: Catalogue des services IT ; le domaine technique du ticket en est déduit.
  - name: Tickets
    description: Déclaration et suivi des incidents.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Système]
      summary: État de l'API et de la base
      security: []
      responses:
        '200':
          description: L'API répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtatApi'

  /auth/connexion:
    post:
      tags: [Authentification]
      summary: Se connecter et obtenir un jeton
      description: |
        Le même message est renvoyé pour un e-mail inconnu, un mauvais mot de passe ou un compte
        désactivé, pour ne pas révéler quels e-mails ont un compte.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identifiants'
      responses:
        '200':
          description: Connexion réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connexion'
        '400':
          description: E-mail ou mot de passe manquant, ou corps JSON mal formé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: E-mail et mot de passe requis
        '401':
          description: Identifiants incorrects ou compte désactivé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: Identifiants incorrects

  /auth/moi:
    get:
      tags: [Authentification]
      summary: Profil de l'utilisateur connecté
      description: Identité lue dans le jeton ; sert à restaurer la session au rechargement de la page.
      responses:
        '200':
          description: Profil de l'utilisateur connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/NonAuthentifie'

  /services:
    get:
      tags: [Services]
      summary: Catalogue des services actifs
      description: >-
        Ouvert à tout utilisateur connecté, pour choisir le service à la création d'un ticket.
        Tri par ordre alphabétique, avec « Autre / je ne sais pas » toujours en dernier.
      responses:
        '200':
          description: Services actifs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
    post:
      tags: [Services]
      summary: Créer un service (ADMIN)
      description: >-
        Le nom doit être unique, sans distinction de majuscules. Le service « Autre / je ne sais
        pas » garde toujours le domaine `A_QUALIFIER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom, domaine]
              additionalProperties: false
              properties:
                nom:
                  type: string
                  example: Téléphonie
                domaine:
                  $ref: '#/components/schemas/Domaine'
      responses:
        '201':
          description: Service créé, actif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Nom vide, domaine inconnu, champ non autorisé ou règle du service Autre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: Domaine technique invalide
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '409':
          $ref: '#/components/responses/NomServiceDejaPris'

  /services/admin:
    get:
      tags: [Services]
      summary: Tous les services, désactivés compris (ADMIN)
      description: Même tri que le catalogue, pour l'écran d'administration.
      responses:
        '200':
          description: Tous les services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'

  /services/{id}:
    patch:
      tags: [Services]
      summary: Modifier ou désactiver un service (ADMIN)
      description: >-
        Un service désactivé n'est plus proposé à la création d'un ticket ; les tickets existants
        le gardent. Le service « Autre / je ne sais pas » ne peut être ni renommé, ni désactivé, ni
        changer de domaine.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifiant MongoDB du service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                nom:
                  type: string
                domaine:
                  $ref: '#/components/schemas/Domaine'
                actif:
                  type: boolean
      responses:
        '200':
          description: Service modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Identifiant mal formé, données invalides ou règle du service Autre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: Le service Autre ne peut pas être désactivé
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
        '409':
          $ref: '#/components/responses/NomServiceDejaPris'

  /tickets:
    post:
      tags: [Tickets]
      summary: Déclarer un incident
      description: >-
        Le demandeur est l'utilisateur connecté (lu dans le jeton). Il ne choisit ni la priorité, ni
        le délai : la priorité est calculée à partir de l'impact et de l'urgence (matrice du cadrage
        9.1) et l'échéance SLA en heures ouvrées (9.2). Le domaine est déduit du service ; « Autre /
        je ne sais pas » donne `A_QUALIFIER`. Le ticket est créé au statut `NOUVEAU`, avec un numéro
        lisible (`reference`, VIG-0042). Interdit au `LECTEUR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreationTicket'
      responses:
        '201':
          description: Ticket créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: >-
            Champ manquant ou invalide, service inconnu ou désactivé, ou champ non autorisé
            (priorité, délai, statut, demandeur…).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: 'Champ non autorisé : priorite'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
    get:
      tags: [Tickets]
      summary: Tickets visibles, les plus récents d'abord
      description: >-
        Un `CLIENT` reçoit les tickets dont il est demandeur, suiveur ou en copie (« Mes
        demandes ») ; les autres rôles reçoivent tous les tickets. Liste minimale de VIGIE-3 : les
        50 plus récents, sans filtre ni pagination (VIGIE-6).
      responses:
        '200':
          description: Tickets visibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResume'
        '401':
          $ref: '#/components/responses/NonAuthentifie'

  /tickets/estimation:
    get:
      tags: [Tickets]
      summary: Priorité et échéance avant la création
      description: >-
        Affiché à l'étape 2 du formulaire (« Délai de traitement estimé »). Même calcul qu'à la
        création, sans rien enregistrer.
      parameters:
        - in: query
          name: impact
          required: true
          schema:
            $ref: '#/components/schemas/Impact'
        - in: query
          name: urgence
          required: true
          schema:
            $ref: '#/components/schemas/Urgence'
      responses:
        '200':
          description: Priorité calculée et échéance SLA si le ticket était créé maintenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prioriteCalculee:
                    $ref: '#/components/schemas/Priorite'
                  echeanceSla:
                    type: string
                    format: date-time
        '400':
          description: Impact ou urgence invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: Impact invalide
        '401':
          $ref: '#/components/responses/NonAuthentifie'

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Lire un ticket
      description: >-
        Mêmes règles de visibilité que la liste. Un ticket que l'utilisateur ne peut pas voir répond
        `404`, comme un ticket inexistant, pour ne pas révéler quels tickets existent.
      parameters:
        - $ref: '#/components/parameters/IdTicket'
      responses:
        '200':
          description: Le ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'

  /tickets/{id}/domaine:
    patch:
      tags: [Tickets]
      summary: Corriger le domaine technique (GESTIONNAIRE, ADMIN)
      description: >-
        Par exemple pour qualifier un ticket « Autre / je ne sais pas ». La correction est tracée
        dans l'historique (ancienne et nouvelle valeur, auteur, date).
      parameters:
        - $ref: '#/components/parameters/IdTicket'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domaine]
              properties:
                domaine:
                  $ref: '#/components/schemas/Domaine'
      responses:
        '200':
          description: Ticket mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Domaine invalide, ou déjà celui du ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: Domaine technique invalide
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
        '409':
          description: Le ticket a été modifié par quelqu'un d'autre entre-temps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                message: 'Le ticket a été modifié entre-temps : rechargez-le'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton reçu à la connexion (valable 8 h par défaut, `JWT_EXPIRES_IN`).

  parameters:
    IdTicket:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Identifiant MongoDB du ticket.

  responses:
    NonAuthentifie:
      description: Jeton absent, invalide ou expiré, ou compte désactivé.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            message: Authentification requise
    Interdit:
      description: Rôle insuffisant, ou LECTEUR qui tente une modification.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            message: Accès interdit
    Introuvable:
      description: Ressource introuvable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            message: Ressource introuvable

    NomServiceDejaPris:
      description: Un service porte déjà ce nom (sans distinction de majuscules).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            message: Un service portant ce nom existe déjà

  schemas:
    Erreur:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Role:
      type: string
      enum: [ADMIN, GESTIONNAIRE, CLIENT, LECTEUR]

    EtatApi:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          enum: [déconnectée, connectée, connexion en cours, déconnexion en cours]

    Identifiants:
      type: object
      required: [email, motDePasse]
      properties:
        email:
          type: string
          format: email
          example: admin@vigie.local
        motDePasse:
          type: string
          format: password

    Utilisateur:
      type: object
      description: Profil public ; le mot de passe n'est jamais renvoyé.
      properties:
        id:
          type: string
          example: 665a1f0c2b7e4a0012345678
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    Connexion:
      type: object
      properties:
        jeton:
          type: string
          description: "JWT à envoyer dans l'en-tête `Authorization: Bearer <jeton>`."
        utilisateur:
          $ref: '#/components/schemas/Utilisateur'

    Domaine:
      type: string
      description: Domaine technique, déduit du service choisi.
      enum: [RESEAU, INFRASTRUCTURE, APPLICATIF, BASE_DE_DONNEES, A_QUALIFIER]

    Service:
      type: object
      properties:
        _id:
          type: string
          example: 665a1f0c2b7e4a0012345678
        nom:
          type: string
          example: VPN
        domaine:
          $ref: '#/components/schemas/Domaine'
        actif:
          type: boolean
          description: Un service désactivé n'est plus proposé à la création d'un ticket.

    Impact:
      type: string
      description: "Qui est touché ? FAIBLE : moi seul, MOYEN : mon équipe, FORT : toute l'entreprise."
      enum: [FAIBLE, MOYEN, FORT]

    Urgence:
      type: string
      description: 'Pouvez-vous continuer ? FAIBLE : je peux continuer, MOYENNE : mode dégradé, HAUTE : je suis bloqué.'
      enum: [FAIBLE, MOYENNE, HAUTE]

    Priorite:
      type: string
      enum: [BASSE, MOYENNE, HAUTE, CRITIQUE]

    Statut:
      type: string
      enum: [NOUVEAU, EN_COURS, EN_ATTENTE_DEMANDEUR, TERMINE, ABANDONNE]

    CreationTicket:
      type: object
      required: [titre, description, service, impact, urgence]
      additionalProperties: false
      properties:
        titre:
          type: string
          maxLength: 120
          example: VPN inaccessible depuis le site de Lyon
        description:
          type: object
          description: >-
            Description guidée (cadrage 9.9). Le serveur assemble les réponses en un texte à
            rubriques fixes ; « messageErreur » vide devient « Non précisé ».
          required: [probleme, depuis]
          properties:
            probleme:
              type: string
              maxLength: 2000
              description: Que se passe-t-il ?
              example: Le client VPN affiche « connexion refusée »
            depuis:
              type: string
              maxLength: 2000
              description: Depuis quand ?
              example: Ce matin, 8 h 30
            messageErreur:
              type: string
              maxLength: 2000
              description: Quel message d'erreur ? (facultatif)
              example: Erreur 809
        service:
          type: string
          description: Identifiant d'un service actif du catalogue (GET /services).
          example: 665a1f0c2b7e4a0012345678
        impact:
          $ref: '#/components/schemas/Impact'
        urgence:
          $ref: '#/components/schemas/Urgence'

    Personne:
      type: object
      nullable: true
      properties:
        _id:
          type: string
        nom:
          type: string
        prenom:
          type: string

    TicketResume:
      type: object
      properties:
        _id:
          type: string
        numero:
          type: integer
          example: 42
        reference:
          type: string
          example: VIG-0042
        titre:
          type: string
        service:
          type: object
          properties:
            _id:
              type: string
            nom:
              type: string
        statut:
          $ref: '#/components/schemas/Statut'
        prioriteFinale:
          $ref: '#/components/schemas/Priorite'
        echeanceSla:
          type: string
          format: date-time
          description: Échéance de résolution, en heures ouvrées.
        createdAt:
          type: string
          format: date-time
          description: Date d'ouverture.

    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketResume'
        - type: object
          properties:
            description:
              type: string
              example: "Que se passe-t-il ?\nLe client VPN affiche « connexion refusée »\n\nDepuis quand ?\nCe matin, 8 h 30\n\nQuel message d'erreur ?\nErreur 809"
            domaine:
              $ref: '#/components/schemas/Domaine'
            impact:
              $ref: '#/components/schemas/Impact'
            urgence:
              $ref: '#/components/schemas/Urgence'
            dateStatut:
              type: string
              format: date-time
              description: Entrée dans le statut actuel.
            demandeur:
              $ref: '#/components/schemas/Personne'
            technicien:
              $ref: '#/components/schemas/Personne'
